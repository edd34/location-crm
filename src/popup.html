<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Notion Rent Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div id="config-section" class="hidden">
    <h3>Notion Config</h3>
    <input type="password" id="api-key" placeholder="Notion API Key">
    <input type="text" id="database-id" placeholder="Database ID">
    <hr>
    <h3>LLM Config (OpenRouter)</h3>
    <input type="password" id="openrouter-api-key" placeholder="OpenRouter API Key">
    <input type="text" id="llm-url" placeholder="LLM URL" value="https://openrouter.ai/api/v1/chat/completions">
    <input type="text" id="llm-model" placeholder="Model (e.g., google/gemini-flash-1.5-8b)"
      value="google/gemini-flash-1.5-8b">
    <input type="text" id="user-phone" placeholder="My Phone Number (to ignore)">
    <hr>
    <h3>Google Maps Config</h3>
    <input type="password" id="google-api-key" placeholder="Google Maps API Key">
    <input type="text" id="work-address" placeholder="Work Address (Destination)">
    <button id="save-config">Save Config</button>
  </div>

  <div id="main-section">
    <header>
      <h3>Add Rent</h3>
      <div class="actions">
        <button id="magic-fill" title="Auto-fill with LLM">✨ AI Fill</button>
        <button id="settings-btn" title="Settings">⚙️</button>
      </div>
    </header>
    <form id="rent-form">
      <div class="field">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
      </div>
      <div class="field">
        <label for="address">Address:</label>
        <input type="text" id="address" name="address">
      </div>
      <div class="field">
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
      </div>
      <div class="field">
        <label for="postal_code">Postal Code:</label>
        <input type="text" id="postal_code" name="postal_code">
      </div>
      <div class="field">
        <label for="neighborhood">Neighborhood:</label>
        <input type="text" id="neighborhood" name="neighborhood">
      </div>
      <div class="field">
        <label for="price">Price (€):</label>
        <input type="number" id="price" name="price" required>
      </div>
      <div class="field">
        <label for="time_to_work">Time to work (min):</label>
        <input type="number" id="time_to_work" name="time_to_work">
      </div>
      <div class="field">
        <label for="transit_lines">Transit Lines:</label>
        <input type="text" id="transit_lines" name="transit_lines" placeholder="e.g. RER A, Bus 123">
      </div>
      <div class="field">
        <label for="area">Area (m²):</label>
        <input type="number" id="area" name="area">
      </div>
      <div class="tri-state-group">
        <div class="field">
          <label for="has_parking">Parking:</label>
          <select id="has_parking" name="has_parking">
            <option value="unknown">?</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="field">
          <label for="has_cave">Cave:</label>
          <select id="has_cave" name="has_cave">
            <option value="unknown">?</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="field">
          <label for="is_furnished">Furnished:</label>
          <select id="is_furnished" name="is_furnished">
            <option value="unknown">?</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="state">State:</label>
        <select id="state" name="state">
          <option value="Interested">Interested</option>
          <option value="Applied">Applied</option>
          <option value="Contacted">Contacted</option>
          <option value="Visited">Visited</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
      <div class="field">
        <label for="agency">Agency:</label>
        <input type="text" id="agency" name="agency">
      </div>
      <div class="field">
        <label for="agency_address">Agency Address:</label>
        <input type="text" id="agency_address" name="agency_address">
      </div>
      <div class="field">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="url">URL:</label>
        <input type="text" id="url" name="url" readonly>
      </div>
      <button type="submit" id="add-btn">Add to Notion</button>
      <div id="status"></div>
    </form>
  </div>

  <script src="popup.js"></script>
</body>

</html>
